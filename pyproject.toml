[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.2.0"
description = "ローカルコードの脆弱性を自分で見つけるための静的解析CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vulnscan" }]
keywords = ["security", "sast", "secrets", "vulnerability", "cli"]
dependencies = []

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnscan = ["py.typed"]
